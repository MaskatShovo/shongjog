name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:demo
      - run: npm run build
      - name: Prepare local integration database
        run: node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0000_fearless_rumiko_fujikawa.sql
      - name: Exercise the real warehouse API
        shell: bash
        run: |
          npm start -- --port 8787 > /tmp/shongjog-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail-with-body http://127.0.0.1:8787/api/orders >/dev/null; then break; fi
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/api/orders || true)
            if [ "$status" = "401" ]; then break; fi
            sleep 1
          done
          npm run test:api
