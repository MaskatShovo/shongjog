<rect width="1280" height="540" rx="22" fill="url(#bg)"/><rect width="1280" height="540" rx="22" fill="url(#dots)"/>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="53" y="48" width="166" height="27" rx="13" fill="#304334"/><circle cx="70" cy="62" r="4" fill="#a9caa0"/><text x="82" y="67" font-size="10" letter-spacing="1.4" fill="#c2d9ba">BUSINESS, UNINTERRUPTED</text>
<text x="52" y="145" font-size="60" font-weight="700" letter-spacing="-3" fill="#f5f4ee">shongjog<tspan fill="#f5a15d">.</tspan></text>
<text x="55" y="212" font-size="37" font-weight="600" letter-spacing="-1" fill="#f0f3f5">Keep business moving.</text><text x="55" y="259" font-size="37" font-weight="600" letter-spacing="-1" fill="#a9c9b6">Even when the network doesn’t.</text>
<text x="56" y="310" font-size="16" fill="#9dafc0">An offline-first continuity layer for field sales in Bangladesh.</text><text x="56" y="339" font-size="16" fill="#9dafc0">Capture the order. Trace the receipt. Prove the recovery.</text>
